name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x sonicplayer/gradlew

      - name: Build debug APK
        working-directory: sonicplayer
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: sonicplayer
        shell: bash
        run: |
          if [ ! -s build.log ]; then
            {
              echo "## Build failed before Gradle"
              echo "No Gradle log was produced. Check the setup steps above."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Build failed before Gradle::No Gradle log was produced. Check the Setup Android SDK and Setup Gradle steps."
            exit 0
          fi

          {
            echo "## Gradle build failed"
            echo
            echo "### Compiler errors"
            echo '```'
            grep -E '^(e: |error: )' build.log | head -n 200 || true
            echo '```'
            echo
            echo "### Failure details"
            echo '```'
            grep -nA 8 -E '^\* What went wrong:|^FAILURE:|^> Task .* FAILED' build.log | head -n 160 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          count=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            echo "::error title=Kotlin compile error::${escaped}"
            count=$((count + 1))
            [ "$count" -ge 10 ] && break
          done < <(grep -E '^e: ' build.log || true)

          if [ "$count" -eq 0 ]; then
            escaped=$(tail -n 30 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${escaped}"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicPlayer-debug-apk
          path: sonicplayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

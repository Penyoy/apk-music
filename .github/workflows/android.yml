name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x sonicplayer/gradlew

      - name: Build debug APK
        working-directory: sonicplayer
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "## Gradle build failed"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            escaped=$(tail -n 40 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${escaped}"
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicPlayer-debug-apk
          path: sonicplayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
